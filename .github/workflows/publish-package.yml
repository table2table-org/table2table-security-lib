# A descriptive name for your workflow
name: Publish Security Library to GitHub Packages

# This configures the trigger for the workflow.
# It will run every time you push code to the 'DEV' branch.
on:
  push:
    branches:
      - DEV

jobs:
  build-and-publish:
    # Use the latest version of Ubuntu as the build environment
    runs-on: ubuntu-latest

    steps:
      # Step 1: Check out the repository's code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up the correct Java version
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Step 3: Build and publish the package
      # This step runs the 'mvn deploy' command, which compiles, tests,
      # and uploads the package to GitHub Packages.
      - name: Build and Publish to GitHub Packages
        run: mvn -B deploy
        env:
          # These environment variables are used by your settings.xml to authenticate.
          # They are populated from the encrypted secrets in your repository settings.
          GITHUB_USER: ${{ secrets.GH_USERNAME }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}